name: protocoloz
description: "Protocolo Z - Sobreviver é um trabalho em equipe!"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.0

  # Estado
  flutter_riverpod: ^2.5.1

  # Rotas
  go_router: ^14.2.0

  # Mapa
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Localização
  geolocator: ^12.0.0

  # Câmera / galeria
  image_picker: ^1.1.2

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.4.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true